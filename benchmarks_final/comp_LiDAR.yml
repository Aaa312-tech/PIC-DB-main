run:
  random_state: 42
  output_layout_gds_path: "/home/hzhou144/projects/PICRoute/src/picroute/result/layout.gds"

dr:
  router: GridRoute
  maxIteration: 10
  
  net_order: "naive"   # topo, naive
  group: True
  enable_45_neighbor: True
  historyCost: 1000
  ripup_times: 10

  grid_resolution: 2
  bend_radius: 5
  net_bound_scale_factor: 1.5
  net_default_bound: 100

  # 这个是propagation的routing penalty
  loss_propagation: 1.5
  # 这个是bending的routing penalty
  loss_bending: 50
  # 这个是crossing的routing penalty
  loss_crossing: 200
  # 这个是congestion的routing penalty
  loss_congestion: 100

  loss_cr: 0.52
  loss_pp: 0.00015
  loss_bend: 0.005
  # loss_comp:
  #   mmi1x2: 0.0
  #   mzi: 0.0
  #   mzi2x2_2x2_phase_shifter: 0.0
  #   grating_coupler_elliptical_lumerical: 0.0
  #   straight_heater_metal_undercut: 0.0
  #   delay_snake2: 0.0
  #   coupler: 0.0
  loss_comp:
    mmi1x2: 0.1
    mzi: 1.2
    mzi2x2_2x2_phase_shifter: 1.2
    grating_coupler_elliptical_lumerical: 2.0
    straight_heater_metal_undercut: 0.05
    delay_snake2: 0.0
    coupler: 0.05
    m_straight_heater_metal : 0.05
    m_mmi_I2_O2: 1.2
    m_mmi_I4_O4: 1.2
    m_mmi_I6_O6: 1.2
    m_mmi_I8_O8: 1.2
    m_mmi_I10_O10: 1.2
    m_mmi_I12_O12: 1.2
    m_mmi_I14_O14: 1.2
    m_mmi_I16_O16: 1.2
    m_mmi_I18_O18: 1.2
    straight: 0.0

show_temp: False

eval: "comp"    # noc, comp
# 这个是evaluation
il_cross: 0.52
il_bending: 0.03
il_propogation: 1.5

incrementalPlacement:
  incre_margin: 2000.0
  incre_radius: 5.0
  incre_K: 10